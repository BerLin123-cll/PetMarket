# ============================================================
# PetMarket 萌宠商城 - 本地开发依赖（Docker Compose）
#
# 只负责启动本地 Redis（MySQL 仍使用本机已安装的实例，不在此管理）。
#
# 常用命令（在项目根目录执行）：
#   docker compose up -d          启动（后台）
#   docker compose ps             查看状态（STATUS 应为 healthy）
#   docker compose logs -f redis  查看日志
#   docker compose down           停止（数据保留在命名卷里）
#   docker compose down -v        停止并删除数据卷（清空缓存）
#
# 连接信息（与 application.yml 默认值一致，可用环境变量覆盖）：
#   host=localhost  port=6379  password=petmarket  database=0
#
# 注意：密码优先取环境变量 REDIS_PASSWORD，未设置时使用开发默认值 petmarket。
#       生产环境务必通过环境变量注入强密码，且不要使用本文件启动生产 Redis。
# ============================================================
services:
  redis:
    image: redis:7.4-alpine
    container_name: petmarket-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      # 仅用于容器内部启动命令与健康检查取密码，不会打进镜像
      REDIS_PASSWORD: ${REDIS_PASSWORD:-petmarket}
    # 用 sh 展开密码变量，避免密码直接固化在 compose 参数里
    # maxmemory-policy=volatile-lru：只淘汰带过期时间的缓存键（本项目的缓存键都带 TTL）
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --requirepass "$$REDIS_PASSWORD"
        --maxmemory 256mb
        --maxmemory-policy volatile-lru
    volumes:
      # AOF 持久化到命名卷，容器重建后缓存数据不丢（缓存可重建，这里只是避免冷启动）
      - petmarket-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  petmarket-redis-data:
    name: petmarket-redis-data
